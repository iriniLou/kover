name: Build

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: dist/*.dmg
          - os: windows-latest
            script: dist:win
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: kover-${{ runner.os }}
          path: ${{ matrix.files }}
      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Attach to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Kover ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: ${{ matrix.files }}
          body: |
            Ковёр для рабочего стола.
            - **Mac:** скачайте `Kover-${{ steps.ver.outputs.v }}-mac.dmg`
            - **Windows:** скачайте `Kover-Setup-${{ steps.ver.outputs.v }}.exe`

            Как открыть неподписанную программу — см. README.
